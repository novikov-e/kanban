# Значения можно переопределить в файле .env рядом с docker-compose.yml
x-db-env: &db-env
  POSTGRES_USER: ${POSTGRES_USER:-kanban_user}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD в .env рядом с docker-compose.yml}
  POSTGRES_DB: ${POSTGRES_DB:-kanban_db}

x-backend-env: &backend-env
  <<: *db-env
  POSTGRES_HOST: postgresql
  POSTGRES_PORT: "5432"
  JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env рядом с docker-compose.yml}
  REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-true}

x-logging: &logging
  driver: "json-file"
  options:
    max-size: "20m"
    max-file: "3"

# Сервисы из образа бэкенда: API, миграции и ежедневная перенумерация позиций
x-backend-service: &backend-service
  build: ./backend
  image: kanban-backend
  environment: *backend-env
  networks:
    - kanban
  security_opt:
    - no-new-privileges:true
  logging: *logging

x-after-migrations: &after-migrations
  migrate:
    condition: service_completed_successfully

services:
  postgresql:
    image: postgres:18.3
    container_name: postgresql
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      <<: *db-env
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgresql:/var/lib/postgresql/data
    networks:
      - kanban
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        reservations:
          cpus: '0.5'
          memory: 1G
        limits:
          cpus: '0.5'
          memory: 1G
    logging: *logging

  migrate:
    <<: *backend-service
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgresql:
        condition: service_healthy

  backend:
    <<: *backend-service
    restart: unless-stopped
    depends_on: *after-migrations

  positions-rebalancer:
    <<: *backend-service
    command: ["python", "-m", "app.jobs.rebalance_positions"]
    restart: unless-stopped
    environment:
      <<: *backend-env
      POSITIONS_REBALANCE_AT: ${POSITIONS_REBALANCE_AT:-03:00}
    depends_on: *after-migrations

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend
    networks:
      - kanban
    logging: *logging

networks:
  kanban:

volumes:
  postgresql:
