<div class="column">
  <header class="column-header">
    <div class="name-field">
      <textarea
        class="name"
        #columnName
        [value]="column().name"
        matInput
        cdkTextareaAutosize
        #autosize="cdkTextareaAutosize"
        appFocus
        cdkAutosizeMinRows="1"
        aria-label="Название колонки"
        i18n-aria-label="@@column.name"
        (change)="rename(columnName.value)"
        (keydown)="onKeydown(columnName, $event)"
      ></textarea>
    </div>

    <span class="count">{{ column().tasks.length }}</span>

    <div class="actions">
      <button
        type="button"
        class="icon-button"
        aria-label="Добавить список"
        i18n-aria-label="@@column.addTask"
        (click)="addTask()"
      >
        <mat-icon>add</mat-icon>
      </button>

      <button
        type="button"
        class="icon-button drag-handle"
        cdkDragHandle
        aria-label="Переместить колонку"
        i18n-aria-label="@@column.move"
      >
        <mat-icon>more_horiz</mat-icon>
      </button>

      <button
        type="button"
        class="icon-button danger"
        aria-label="Удалить колонку"
        i18n-aria-label="@@column.delete"
        (click)="delete()"
      >
        <mat-icon>delete_outline</mat-icon>
      </button>
    </div>
  </header>

  <div
    class="task-list"
    cdkDropList
    [id]="taskListId(column().id)"
    [cdkDropListData]="column().tasks"
    [cdkDropListConnectedTo]="store.taskListIds()"
    (cdkDropListDropped)="onTaskDrop($event)"
  >
    @for (task of column().tasks; track task.id) {
      <div class="task-item" cdkDrag [cdkDragData]="task">
        <app-task [task]="task"></app-task>
      </div>
    }
  </div>
</div>
