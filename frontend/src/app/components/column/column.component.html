<div class="column">
  <div class="border_container column_header">
    <div class="title-and-buttons">
      <div class="text_grow">
        <textarea
          class="transparent_text_input column-task-title"
          #columnName
          [value]="column().name"
          matInput
          cdkTextareaAutosize
          #autosize="cdkTextareaAutosize"
          appFocus
          cdkAutosizeMinRows="1"
          aria-label="Название колонки"
          i18n-aria-label="@@column.name"
          (change)="rename(columnName.value)"
          (keydown)="onKeydown(columnName, $event)"
        >
        </textarea>
      </div>

      <div class="buttons_container">
        <button
          class="custom_icon_button"
          aria-label="Добавить список"
          i18n-aria-label="@@column.addTask"
          (click)="addTask()"
        >
          <mat-icon>assignment_add</mat-icon>
        </button>

        <button
          class="custom_icon_button"
          aria-label="Удалить колонку"
          i18n-aria-label="@@column.delete"
          (click)="delete()"
        >
          <mat-icon>remove_circle_outline</mat-icon>
        </button>
      </div>
    </div>
  </div>
  <div
    class="column-drop-list"
    cdkDropList
    [id]="taskListId(column().id)"
    [cdkDropListData]="column().tasks"
    [cdkDropListConnectedTo]="store.taskListIds()"
    (cdkDropListDropped)="onTaskDrop($event)"
  >
    @for (task of column().tasks; track task.id) {
      <div cdkDrag [cdkDragData]="task">
        <app-task [task]="task"></app-task>
      </div>
    }
  </div>
</div>
