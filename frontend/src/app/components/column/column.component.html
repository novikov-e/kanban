@let palette = colors();
<div class="column">
  <div class="border_container min-height-38" [style.border-color]="palette[1].firstColor">
    <div class="title-and-buttons" [style.border-color]="palette[1].firstColor">
      <div class="text_grow">
        <textarea
          class="transparent_text_input column-task-title"
          #columnName
          [value]="column().name"
          matInput
          cdkTextareaAutosize
          #autosize="cdkTextareaAutosize"
          appFocus
          cdkAutosizeMinRows="1"
          [style.color]="palette[1].firstColor"
          (change)="rename(columnName.value)"
          (keydown)="onKeydown(columnName, $event)"
        >
        </textarea>
      </div>

      <div class="buttons_container">
        <button
          class="custom_icon_button"
          appButtonHover
          [elementRef]="newTaskIcon._elementRef"
          [color]="palette[1]"
          (click)="addTask()"
        >
          <mat-icon class="button_icon" #newTaskIcon [style.color]="palette[1].firstColor">assignment_add</mat-icon>
        </button>

        <button
          class="custom_icon_button"
          appButtonHover
          [elementRef]="removeColumnIcon._elementRef"
          [color]="palette[1]"
          (click)="delete()"
        >
          <mat-icon #removeColumnIcon [style.color]="palette[1].firstColor">remove_circle_outline</mat-icon>
        </button>
      </div>
    </div>
  </div>
  <div
    class="column-drop-list"
    cdkDropList
    [id]="taskListId(column().id)"
    [cdkDropListData]="column().tasks"
    [cdkDropListConnectedTo]="store.taskListIds()"
    (cdkDropListDropped)="onTaskDrop($event)"
  >
    @for (task of column().tasks; track task.id) {
      <div cdkDrag [cdkDragData]="task">
        <app-task [task]="task" [colors]="palette"></app-task>
      </div>
    }
  </div>
</div>
