<div class="column">
    <div class="border_container min-height-38" [style.border-color]="colors[1].firstColor">
        <div class="title-and-buttons" [style.border-color]="colors[1].firstColor">
            <div class="text_grow">
        <textarea class="transparent_text_input column-task-title" #columnName
                  [value]="column.name" matInput cdkTextareaAutosize #autosize="cdkTextareaAutosize"
                  appFocus cdkAutosizeMinRows="1" [style.color]="colors[1].firstColor"
                  (change)="renameColumn(columnName.value)"
                  (keydown)="keyPressed(columnName, $event, columnName.value)">
        </textarea>
            </div>

            <div class="buttons_container">
                <button class="custom_icon_button" appButtonHover
                        [elementRef]="newTaskIcon._elementRef" [color]="colors[1]" (click)="newTask()">
                    <mat-icon class="button_icon" #newTaskIcon [style.color]="colors[1].firstColor">assignment_add
                    </mat-icon>
                </button>

                <button class="custom_icon_button" appButtonHover
                        [elementRef]="removeColumnIcon._elementRef" [color]="colors[1]" (click)="deleteColumn()">
                    <mat-icon #removeColumnIcon [style.color]="colors[1].firstColor">remove_circle_outline</mat-icon>
                </button>
            </div>
        </div>
    </div>
    <div class="column-drop-list" id="{{column.id}}" cdkDropList [cdkDropListData]="column.tasks"
         [cdkDropListConnectedTo]="taskDropLists" (cdkDropListDropped)="moveTask($event)">
        <div cdkDrag *ngFor="let task of column.tasks">
            <div *cdkDragPlaceholder></div>
            <app-task [task]="task" [subtaskDropLists]="subtaskDropLists"
                      [colors]="colors" [columnComponent]="this"></app-task>
        </div>
    </div>
</div>
