<div
  class="columns"
  cdkDropList
  [cdkDropListData]="board().columns"
  cdkDropListOrientation="horizontal"
  (cdkDropListDropped)="onColumnDrop($event)"
>
  @for (column of board().columns; track column.id) {
    <div class="column_item" cdkDrag [cdkDragData]="column">
      <app-column [column]="column" [colors]="colors()"></app-column>
    </div>
  }
</div>
