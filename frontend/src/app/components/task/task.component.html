@let palette = colors();
@let color = palette[task().color];
<div class="border_container" [style.border-color]="color.firstColor">
  <div class="title-and-buttons">
    <div class="text_grow">
      <textarea
        class="transparent_text_input column-task-title"
        #taskName
        matInput
        cdkTextareaAutosize
        #autosize="cdkTextareaAutosize"
        cdkAutosizeMinRows="1"
        [value]="task().name"
        [style.color]="color.firstColor"
        (change)="rename(taskName.value)"
        appFocus
        (keydown)="onKeydown(taskName, $event)"
      >
      </textarea>
    </div>

    <div class="buttons_container">
      <button
        class="custom_icon_button"
        appButtonHover
        [elementRef]="addSubtaskIcon._elementRef"
        [color]="color"
        (click)="addSubtask()"
      >
        <mat-icon #addSubtaskIcon [style.color]="color.firstColor">add_circle_outline</mat-icon>
      </button>

      <button
        class="custom_icon_button"
        appButtonHover
        [elementRef]="colorIcon._elementRef"
        [color]="color"
        [cdkMenuTriggerFor]="menu"
      >
        <mat-icon #colorIcon [style.color]="color.firstColor">circle</mat-icon>
      </button>

      <ng-template #menu>
        <div
          class="colors-menu"
          [style.border-color]="palette[1].firstColor"
          [style.background-color]="palette[0].firstColor"
          cdkMenu
        >
          @for (paletteColor of palette.slice(1); track $index) {
            <button class="custom_icon_button">
              <mat-icon cdkMenuItem [style.color]="paletteColor.firstColor" (click)="changeColor($index + 1)"
                >circle</mat-icon
              >
            </button>
          }
        </div>
      </ng-template>

      <button
        class="custom_icon_button"
        appButtonHover
        [elementRef]="removeTaskIcon._elementRef"
        [color]="color"
        (click)="delete()"
      >
        <mat-icon #removeTaskIcon [style.color]="color.firstColor">remove_circle_outline</mat-icon>
      </button>
    </div>
  </div>

  <div
    cdkDropList
    [id]="subtaskListId(task().id)"
    [cdkDropListData]="task().subtasks"
    [cdkDropListConnectedTo]="store.subtaskListIds()"
    class="subtask_drag_list"
    (cdkDropListDropped)="onSubtaskDrop($event)"
  >
    @for (subtask of task().subtasks; track subtask.id) {
      <div cdkDrag [cdkDragData]="subtask">
        <app-subtask [subtask]="subtask" [taskId]="task().id" [color]="color"></app-subtask>
      </div>
    }
  </div>
</div>
