<div class="border_container" [style.border-color]="colors[task.color].firstColor">
  <div class="title-and-buttons">
    <div class="text_grow">
      <textarea
        class="transparent_text_input column-task-title"
        #taskName
        matInput
        cdkTextareaAutosize
        #autosize="cdkTextareaAutosize"
        cdkAutosizeMinRows="1"
        [value]="task.name"
        [style.color]="colors[task.color].firstColor"
        (change)="rename(taskName.value)"
        appFocus
        (keydown)="onKeydown(taskName, $event)"
      >
      </textarea>
    </div>

    <div class="buttons_container">
      <button
        class="custom_icon_button"
        appButtonHover
        [elementRef]="addSubtaskIcon._elementRef"
        [color]="colors[task.color]"
        (click)="addSubtask()"
      >
        <mat-icon #addSubtaskIcon [style.color]="colors[task.color].firstColor">add_circle_outline</mat-icon>
      </button>

      <button
        class="custom_icon_button"
        appButtonHover
        [elementRef]="colorIcon._elementRef"
        [color]="colors[task.color]"
        [cdkMenuTriggerFor]="menu"
      >
        <mat-icon #colorIcon [style.color]="colors[task.color].firstColor">circle</mat-icon>
      </button>

      <ng-template #menu>
        <div
          class="colors-menu"
          [style.border-color]="colors[1].firstColor"
          [style.background-color]="colors[0].firstColor"
          cdkMenu
        >
          @for (paletteColor of colors.slice(1); track $index) {
            <button class="custom_icon_button">
              <mat-icon cdkMenuItem [style.color]="paletteColor.firstColor" (click)="changeColor($index + 1)"
                >circle</mat-icon
              >
            </button>
          }
        </div>
      </ng-template>

      <button
        class="custom_icon_button"
        appButtonHover
        [elementRef]="removeTaskIcon._elementRef"
        [color]="colors[task.color]"
        (click)="delete()"
      >
        <mat-icon #removeTaskIcon [style.color]="colors[task.color].firstColor">remove_circle_outline</mat-icon>
      </button>
    </div>
  </div>

  <div
    cdkDropList
    id="{{ task.id }}"
    [cdkDropListData]="task.subtasks"
    class="subtask_drag_list"
    [cdkDropListConnectedTo]="subtaskDropLists"
    (cdkDropListDropped)="onSubtaskDrop($event)"
  >
    @for (subtask of task.subtasks; track subtask) {
      <div cdkDrag [cdkDragData]="subtask">
        <app-subtask
          [subtask]="subtask"
          [taskId]="task.id"
          [color]="colors[task.color]"
          (deleted)="removeSubtask(subtask)"
          (nextRequested)="addSubtask()"
        ></app-subtask>
      </div>
    }
  </div>
</div>
