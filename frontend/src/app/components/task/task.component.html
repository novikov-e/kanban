<article class="task">
  <header class="task-header">
    <div class="name-field">
      <textarea
        class="name"
        #taskName
        matInput
        cdkTextareaAutosize
        #autosize="cdkTextareaAutosize"
        cdkAutosizeMinRows="1"
        [value]="task().name"
        aria-label="Название списка"
        i18n-aria-label="@@task.name"
        (change)="rename(taskName.value)"
        appFocus
        (keydown)="onKeydown(taskName, $event)"
      ></textarea>
    </div>

    <span class="count">{{ task().subtasks.length }}</span>

    <div class="actions">
      <button
        type="button"
        class="icon-button"
        aria-label="Добавить задачу"
        i18n-aria-label="@@task.addSubtask"
        (click)="addSubtask()"
      >
        <mat-icon>add</mat-icon>
      </button>

      <button
        type="button"
        class="icon-button color-trigger"
        [cdkMenuTriggerFor]="menu"
        aria-label="Цвет списка"
        i18n-aria-label="@@task.color"
      >
        <mat-icon>circle</mat-icon>
      </button>

      <ng-template #menu>
        <div class="colors-menu" cdkMenu>
          @for (taskColor of taskColors; track taskColor.value) {
            <button
              type="button"
              class="icon-button color-option"
              cdkMenuItem
              [attr.data-color]="taskColor.value"
              [attr.aria-label]="taskColor.name"
              (cdkMenuItemTriggered)="changeColor(taskColor.value)"
            >
              <mat-icon>circle</mat-icon>
            </button>
          }
        </div>
      </ng-template>

      <button
        type="button"
        class="icon-button drag-handle"
        cdkDragHandle
        aria-label="Переместить список"
        i18n-aria-label="@@task.move"
      >
        <mat-icon>more_horiz</mat-icon>
      </button>

      <button
        type="button"
        class="icon-button danger"
        aria-label="Удалить список"
        i18n-aria-label="@@task.delete"
        (click)="delete()"
      >
        <mat-icon>delete_outline</mat-icon>
      </button>
    </div>
  </header>

  <div
    class="subtasks"
    cdkDropList
    [id]="subtaskListId(task().id)"
    [cdkDropListData]="task().subtasks"
    [cdkDropListConnectedTo]="store.subtaskListIds()"
    (cdkDropListDropped)="onSubtaskDrop($event)"
  >
    @for (subtask of task().subtasks; track subtask.id) {
      <div class="subtask-item" cdkDrag [cdkDragData]="subtask" cdkDragPreviewContainer="parent">
        <app-subtask [subtask]="subtask" [taskId]="task().id"></app-subtask>
      </div>
    }
  </div>
</article>
