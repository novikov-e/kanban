<div class="subtask">
  <button
    type="button"
    class="checkbox"
    [class.checked]="subtask().state"
    role="checkbox"
    [attr.aria-checked]="subtask().state"
    aria-label="Выполнена"
    i18n-aria-label="@@subtask.done"
    (click)="toggleState()"
  ></button>

  <div class="name-field">
    <textarea
      class="name"
      matInput
      cdkTextareaAutosize
      appFocus
      #autosize="cdkTextareaAutosize"
      cdkAutosizeMinRows="1"
      #subtaskName
      [value]="subtask().name"
      aria-label="Название задачи"
      i18n-aria-label="@@subtask.name"
      (change)="rename(subtaskName.value)"
      (keydown)="onKeydown(subtaskName, $event)"
    ></textarea>
  </div>

  <div class="actions">
    <button
      type="button"
      class="icon-button drag-handle"
      cdkDragHandle
      aria-label="Переместить задачу"
      i18n-aria-label="@@subtask.move"
    >
      <mat-icon>more_horiz</mat-icon>
    </button>

    <button
      type="button"
      class="icon-button danger"
      aria-label="Удалить задачу"
      i18n-aria-label="@@subtask.delete"
      (click)="delete()"
    >
      <mat-icon>delete_outline</mat-icon>
    </button>
  </div>
</div>
