@let colors = userStore.colors();
@let user = userStore.user();
@let board = boardStore.board();
<div class="app" [style.background-color]="colors[0].firstColor">
  <div class="header" [style.border-color]="colors[1].firstColor">
    <div class="buttons_container ml-5">
      <button
        class="text_button"
        appTextButton
        [matIcon]="menuIcon._elementRef"
        [text]="menuButton"
        [color]="colors[1]"
        (click)="drawer.toggle()"
      >
        <mat-icon #menuIcon [style.color]="colors[1].firstColor">menu</mat-icon>
        <div class="text_in_header_button" #menuButton [style.color]="colors[1].firstColor">Меню</div>
      </button>
    </div>

    @if (board) {
      <div class="gr">
        <input
          type="text"
          class="transparent_text_input column-task-title text_align_center font-size-17"
          #boardName
          [value]="board.name"
          matInput
          appSelect
          [style.color]="colors[1].firstColor"
          (change)="renameBoard(board.id, boardName.value)"
        />
      </div>

      <div class="buttons_container mr-5">
        <button
          class="text_button"
          appTextButton
          [matIcon]="newColumnIcon._elementRef"
          [text]="newColumnButton"
          [color]="colors[1]"
          (click)="boardStore.addColumn()"
        >
          <mat-icon #newColumnIcon [style.color]="colors[1].firstColor">add_circle_outline</mat-icon>
          <div class="text_in_header_button" #newColumnButton [style.color]="colors[1].firstColor">
            Добавить колонку
          </div>
        </button>
        <button
          class="text_button"
          appTextButton
          [matIcon]="exitIcon._elementRef"
          [text]="exitButton"
          [color]="colors[1]"
          (click)="closeBoard()"
        >
          <mat-icon #exitIcon [style.color]="colors[1].firstColor">logout</mat-icon>
          <div class="text_in_header_button" #exitButton [style.color]="colors[1].firstColor">Выйти из проекта</div>
        </button>
        <button
          class="text_button"
          appTextButton
          [matIcon]="deleteBoardIcon._elementRef"
          [text]="deleteBoardButton"
          [color]="colors[2]"
          (click)="deleteBoard(board.id)"
        >
          <mat-icon #deleteBoardIcon [style.color]="colors[2].firstColor">remove_circle_outline</mat-icon>
          <div class="text_in_header_button" #deleteBoardButton [style.color]="colors[2].firstColor">
            Удалить проект
          </div>
        </button>
      </div>
    }
  </div>

  <div class="workspace_container">
    <mat-drawer-container class="background_transparent" autosize>
      <mat-drawer class="background_transparent pl-1" #drawer mode="side">
        @if (user) {
          <div class="user_details" [style.border-color]="colors[1].firstColor">
            <button
              class="text_button m-5"
              appTextButton
              [matIcon]="createBoardIcon._elementRef"
              [text]="createBoardButton"
              [color]="colors[1]"
              (click)="createBoard()"
            >
              <mat-icon #createBoardIcon [style.color]="colors[1].firstColor">add_circle_outline</mat-icon>
              <div class="text_in_button" #createBoardButton [style.color]="colors[1].firstColor">Создать проект</div>
            </button>

            <div
              class="list_boards"
              cdkDropList
              (cdkDropListDropped)="onBoardDrop($event)"
              cdkDropListOrientation="vertical"
            >
              @for (userBoard of user.boards; track userBoard.id) {
                <div class="board_item" cdkDrag [cdkDragData]="userBoard">
                  <button
                    class="text_button m-5"
                    appTextButton
                    [matIcon]="dashboardIcon._elementRef"
                    [text]="dashboardButton"
                    [color]="colors[1]"
                    [routerLink]="['/boards', userBoard.id]"
                  >
                    <mat-icon #dashboardIcon [style.color]="colors[1].firstColor">dashboard</mat-icon>
                    <div class="text_in_button" #dashboardButton [style.color]="colors[1].firstColor">
                      {{ userBoard.name }}
                    </div>
                  </button>
                </div>
              }
            </div>

            <button
              class="text_button m-5"
              appTextButton
              [matIcon]="settingsIcon._elementRef"
              [text]="settingsButton"
              [color]="colors[1]"
            >
              <mat-icon #settingsIcon [style.color]="colors[1].firstColor">settings</mat-icon>
              <div class="text_in_button" #settingsButton [style.color]="colors[1].firstColor">Настройки</div>
            </button>

            <button
              class="text_button m-5"
              appTextButton
              [matIcon]="themeIcon._elementRef"
              [text]="themeButton"
              [color]="colors[1]"
              (click)="userStore.toggleTheme()"
            >
              <mat-icon #themeIcon [style.color]="colors[1].firstColor">{{
                user.darkTheme ? 'light_mode' : 'dark_mode'
              }}</mat-icon>
              <div class="text_in_button" #themeButton [style.color]="colors[1].firstColor">
                {{ user.darkTheme ? 'Светлая тема' : 'Тёмная тема' }}
              </div>
            </button>

            <button
              class="text_button m-5"
              appTextButton
              [matIcon]="logoutIcon._elementRef"
              [text]="logoutButton"
              [color]="colors[1]"
              (click)="logout()"
            >
              <mat-icon #logoutIcon [style.color]="colors[1].firstColor">logout</mat-icon>
              <div class="text_in_button" #logoutButton [style.color]="colors[1].firstColor">Выйти</div>
            </button>
          </div>
        }
      </mat-drawer>
      <router-outlet />
    </mat-drawer-container>
  </div>
</div>
