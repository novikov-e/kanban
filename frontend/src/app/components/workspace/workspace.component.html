@let user = userStore.user();
@let board = boardStore.board();
<div class="app">
  <div class="header">
    <div class="buttons_container ml-5">
      <button class="text_button" (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
        <div class="text_in_header_button" i18n="@@workspace.menu">Меню</div>
      </button>
    </div>

    @if (board) {
      <div class="board_title">
        <input
          type="text"
          class="transparent_text_input column-task-title"
          #boardName
          [value]="board.name"
          matInput
          appSelect
          aria-label="Название проекта"
          i18n-aria-label="@@board.name"
          (change)="renameBoard(board.id, boardName.value)"
        />
      </div>

      <label class="search">
        <mat-icon>search</mat-icon>
        <input
          #search
          type="search"
          [value]="boardStore.searchQuery()"
          placeholder="Поиск"
          i18n-placeholder="@@board.search"
          aria-label="Поиск"
          i18n-aria-label="@@board.search"
          (input)="boardStore.setSearch(search.value)"
          (keydown.escape)="clearSearch(search)"
        />
        @if (!boardStore.searchQuery()) {
          <span class="search-hint" i18n="@@board.searchHint">Ctrl K</span>
        }
      </label>

      <div class="buttons_container mr-5">
        <button class="text_button" (click)="boardStore.addColumn()">
          <mat-icon>add_circle_outline</mat-icon>
          <div class="text_in_header_button" i18n="@@board.addColumn">Добавить колонку</div>
        </button>
        <button class="text_button" (click)="closeBoard()">
          <mat-icon>logout</mat-icon>
          <div class="text_in_header_button" i18n="@@board.close">Выйти из проекта</div>
        </button>
        <button class="text_button danger" (click)="deleteBoard(board.id)">
          <mat-icon>remove_circle_outline</mat-icon>
          <div class="text_in_header_button" i18n="@@board.delete">Удалить проект</div>
        </button>
      </div>
    }
  </div>

  <div class="workspace_container">
    <mat-drawer-container class="background_transparent" autosize>
      <mat-drawer class="background_transparent pl-1" #drawer mode="side">
        @if (user) {
          <div class="user_details">
            <button class="text_button m-5" (click)="createBoard()">
              <mat-icon>add_circle_outline</mat-icon>
              <div class="text_in_button" i18n="@@workspace.createBoard">Создать проект</div>
            </button>

            <div
              class="list_boards"
              cdkDropList
              (cdkDropListDropped)="onBoardDrop($event)"
              cdkDropListOrientation="vertical"
            >
              @for (userBoard of user.boards; track userBoard.id) {
                <div class="board_item" cdkDrag [cdkDragData]="userBoard">
                  <button class="text_button m-5" [routerLink]="['/boards', userBoard.id]">
                    <mat-icon>dashboard</mat-icon>
                    <div class="text_in_button">{{ userBoard.name }}</div>
                  </button>
                </div>
              }
            </div>

            <button class="text_button m-5">
              <mat-icon>settings</mat-icon>
              <div class="text_in_button" i18n="@@workspace.settings">Настройки</div>
            </button>

            <button class="text_button m-5" (click)="userStore.toggleTheme()">
              <mat-icon>{{ user.darkTheme ? 'light_mode' : 'dark_mode' }}</mat-icon>
              <div class="text_in_button">
                @if (user.darkTheme) {
                  <ng-container i18n="@@workspace.lightTheme">Светлая тема</ng-container>
                } @else {
                  <ng-container i18n="@@workspace.darkTheme">Тёмная тема</ng-container>
                }
              </div>
            </button>

            <button class="text_button m-5" (click)="logout()">
              <mat-icon>logout</mat-icon>
              <div class="text_in_button" i18n="@@workspace.logout">Выйти</div>
            </button>
          </div>
        }
      </mat-drawer>
      <router-outlet />
    </mat-drawer-container>
  </div>
</div>
