@let user = userStore.user();
@let board = boardStore.board();
<div class="app">
  <header class="topbar">
    <div class="brand">
      <mat-icon aria-hidden="true">view_kanban</mat-icon>
      <span i18n="@@app.name">Канбан</span>
    </div>
    <a
      class="nav-link"
      routerLink="/boards"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{exact: true}"
      i18n="@@nav.boards"
    >
      Доски
    </a>
    <div class="spacer"></div>
    <label class="search">
      <mat-icon>search</mat-icon>
      <input
        #search
        type="search"
        [value]="boardStore.searchQuery()"
        placeholder="Поиск"
        i18n-placeholder="@@board.search"
        aria-label="Поиск"
        i18n-aria-label="@@board.search"
        (input)="boardStore.setSearch(search.value)"
        (keydown.escape)="clearSearch(search)"
      />
      @if (!boardStore.searchQuery()) {
        <span class="search-hint" i18n="@@board.searchHint">Ctrl K</span>
      }
    </label>
    @if (user) {
      <button type="button" class="account" [cdkMenuTriggerFor]="accountMenu" [attr.aria-label]="accountLabel">
        {{ initials(user) }}
      </button>
      <ng-template #accountMenu>
        <div class="popup" cdkMenu>
          <a class="popup-item" cdkMenuItem routerLink="/profile">
            <mat-icon aria-hidden="true">person</mat-icon>
            <span i18n="@@account.profile">Профиль</span>
          </a>
          <button type="button" class="popup-item" cdkMenuItem (cdkMenuItemTriggered)="theme.toggle()">
            <mat-icon aria-hidden="true">{{ theme.isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
            @if (theme.isDark()) {
              <span i18n="@@workspace.lightTheme">Светлая тема</span>
            } @else {
              <span i18n="@@workspace.darkTheme">Тёмная тема</span>
            }
          </button>
          <button type="button" class="popup-item" cdkMenuItem (cdkMenuItemTriggered)="logout()">
            <mat-icon aria-hidden="true">logout</mat-icon>
            <span i18n="@@workspace.logout">Выйти</span>
          </button>
        </div>
      </ng-template>
    }
  </header>

  @if (board) {
    <div class="toolbar">
      <a class="back" routerLink="/boards" aria-label="Назад" i18n-aria-label="@@board.back">
        <mat-icon>arrow_back</mat-icon>
      </a>
      <input
        type="text"
        class="board-name"
        #boardName
        [value]="board.name"
        appSelect
        aria-label="Название доски"
        i18n-aria-label="@@board.name"
        (change)="renameBoard(board.id, boardName.value)"
      />
      <div class="toolbar-actions">
        <button type="button" class="primary" (click)="boardStore.addColumn()">
          <mat-icon>add</mat-icon>
          <span i18n="@@board.addColumn">Добавить колонку</span>
        </button>
        <div class="filter">
          <button
            type="button"
            class="filter-button"
            [class.active]="boardStore.colors().length > 0"
            [attr.aria-expanded]="filtersOpen()"
            (click)="toggleFilters($event)"
          >
            <mat-icon>filter_list</mat-icon>
            <span i18n="@@board.filters">Фильтры</span>
          </button>
          @if (filtersOpen()) {
            <div
              class="color-filter"
              role="group"
              aria-label="Цвет"
              i18n-aria-label="@@board.filterColor"
              (click)="$event.stopPropagation()"
            >
              @for (color of taskColors; track color.value) {
                <button
                  type="button"
                  class="color-filter-item"
                  [class.selected]="boardStore.colors().includes(color.value)"
                  [attr.data-color]="color.value"
                  [attr.aria-pressed]="boardStore.colors().includes(color.value)"
                  (click)="boardStore.toggleColor(color.value)"
                >
                  <span class="swatch"></span>
                  {{ color.name }}
                </button>
              }
            </div>
          }
        </div>
      </div>
    </div>
  }

  <div class="workspace">
    <router-outlet />
  </div>
</div>
