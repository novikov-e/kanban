server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Заголовки уровня server не наследуются в location со своим add_header, поэтому сниппет подключён и там
    include /etc/nginx/snippets/security-headers.conf;

    # backend — имя сервиса в docker-compose
    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Сборка Angular добавляет хеш содержимого в имя файла (main-ABCD1234.js), такие файлы не меняются
    location ~* "-[A-Z0-9]{8}\.[a-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # index.html и файлы без хеша браузер перепроверяет по ETag, чтобы после деплоя загрузить новую сборку
    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
